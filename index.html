<script>
        // ΒΑΛΕ ΕΔΩ ΤΟ WEB APP URL ΑΠΟ ΤΟ GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbyZESmS6vPrmjQsa6ZfAsHFLhcL562KhyfS_39cEUcZJp3fA6li9iGZcnqOV-_346KS/exec";

        let rawData = { isp: [], scada: [] };
        let chartInstance = null;

        // ΣΥΝΑΡΤΗΣΗ ΚΑΘΑΡΙΣΜΟΥ ΑΡΙΘΜΩΝ
        function parseNum(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            let str = String(val).trim().replace(',', '.').replace(/[^0-9.-]/g, '');
            let n = parseFloat(str);
            return isNaN(n) ? 0 : n;
        }

        // ΣΥΝΑΡΤΗΣΗ ΔΥΝΑΜΙΚΗΣ ΚΑΝΟΝΙΚΟΠΟΙΗΣΗΣ ΔΕΔΟΜΕΝΩΝ (Αγνοεί κενά/τυπογραφικά στις στήλες)
        function normalizeData(dataArray) {
            if (!dataArray || dataArray.length === 0) return [];
            const sample = dataArray[0];
            const keys = Object.keys(sample);
            
            // Βρίσκουμε τις στήλες δυναμικά ψάχνοντας λέξεις κλειδιά
            const dateKey = keys.find(k => k.includes("Ημερομηνία") || k.includes("Date")) || "Ημερομηνία";
            const unitKey = keys.find(k => k.includes("Μονάδα") || k.includes("Unit")) || "Μονάδα BESS";
            const chargeKey = keys.find(k => k.includes("Φόρτιση") && !k.includes("Αποφόρτιση")) || "Φόρτιση (MWh)";
            const dischargeKey = keys.find(k => k.includes("Αποφόρτιση")) || "Αποφόρτιση (MWh)";
            const rteKey = keys.find(k => k.includes("RTE")) || "RTE (%)";

            return dataArray.map(d => ({
                date: d[dateKey],
                unit: String(d[unitKey] || "").trim(),
                charge: parseNum(d[chargeKey]),
                discharge: parseNum(d[dischargeKey]),
                rte: d[rteKey] || "0.00%"
            }));
        }

        async function init() {
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                
                // Περνάμε τα δεδομένα από το "φίλτρο" κανονικοποίησης
                rawData.isp = normalizeData(json.isp);
                rawData.scada = normalizeData(json.scada);
                
                const dates = [...new Set([
                    ...rawData.isp.map(d => d.date),
                    ...rawData.scada.map(d => d.date)
                ])].filter(d => d).sort().reverse();

                const select = document.getElementById('dateSelect');
                select.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');

                updateDashboard();
            } catch (err) {
                alert("Σφάλμα κατά τη φόρτωση των δεδομένων: " + err.message);
                console.error(err);
            }
        }

        function updateDashboard() {
            const selectedDate = document.getElementById('dateSelect').value;

            const ispDay = rawData.isp.filter(d => d.date === selectedDate);
            const scadaDay = rawData.scada.filter(d => d.date === selectedDate);

            // Ενημέρωση KPIs (TOTAL BESS)
            const ispTotal = ispDay.find(d => d.unit === "TOTAL BESS") || { charge: 0, discharge: 0, rte: "0.00%" };
            const scadaTotal = scadaDay.find(d => d.unit === "TOTAL BESS") || { charge: 0, discharge: 0, rte: "0.00%" };

            document.getElementById('kpiChargeIsp').innerText = ispTotal.charge.toFixed(2);
            document.getElementById('kpiChargeScada').innerText = scadaTotal.charge.toFixed(2);
            document.getElementById('kpiDischargeIsp').innerText = ispTotal.discharge.toFixed(2);
            document.getElementById('kpiDischargeScada').innerText = scadaTotal.discharge.toFixed(2);
            document.getElementById('kpiRteIsp').innerText = ispTotal.rte;
            document.getElementById('kpiRteScada').innerText = scadaTotal.rte;

            // Λογική ταύτισης μονάδων (Αφαιρεί _BZ1_ και _ για να ταυτιστούν απόλυτα)
            const unitMap = {};

            function getBaseUnitId(name) {
                return name.toUpperCase().replace(/BZ\d+/g, '').replace(/_/g, '');
            }

            ispDay.forEach(d => {
                if (d.unit === "TOTAL BESS") return;
                const id = getBaseUnitId(d.unit);
                if (!unitMap[id]) unitMap[id] = { display: d.unit.replace(/_BZ\d+_/g, '_'), isp: 0, scada: 0 };
                unitMap[id].isp += d.discharge;
            });

            scadaDay.forEach(d => {
                if (d.unit === "TOTAL BESS") return;
                const id = getBaseUnitId(d.unit);
                if (!unitMap[id]) unitMap[id] = { display: d.unit, isp: 0, scada: 0 };
                unitMap[id].scada += d.discharge;
                unitMap[id].display = d.unit; // Κρατάμε το πιο "καθαρό" όνομα του SCADA για την ετικέτα
            });

            const units = Object.keys(unitMap).sort();
            const labels = units.map(u => unitMap[u].display);
            const ispDischarge = units.map(u => unitMap[u].isp);
            const scadaDischarge = units.map(u => unitMap[u].scada);

            renderChart(labels, ispDischarge, scadaDischarge);
        }

        function renderChart(labels, ispData, scadaData) {
            const ctx = document.getElementById('bessChart').getContext('2d');
            
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'ISP Αποφόρτιση (MWh)', data: ispData, backgroundColor: '#60a5fa' },
                        { label: 'SCADA Αποφόρτιση (MWh)', data: scadaData, backgroundColor: '#34d399' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#cbd5e1' } } },
                    scales: {
                        x: { ticks: { color: '#94a3b8', autoSkip: false }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        init();
    </script>
